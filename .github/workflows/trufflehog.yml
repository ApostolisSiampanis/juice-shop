name: TruffleHog Secrets Scan

on:
  workflow_call:
    inputs:
      base_branch:
        description: 'Default branch name (only used if you later switch to base/head mode).'
        required: false
        default: main
        type: string
      scan_depth:
        description: 'Scan last N commits (0 = full history).'
        required: false
        default: 50
        type: number
      fail_on_any:
        description: 'If true, fail on ANY finding; if false, fail ONLY on verified findings.'
        required: false
        default: false
        type: boolean
      extra_args:
        description: 'Additional flags for TruffleHog (e.g. --exclude-paths=.trufflehogignore).'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Default branch (for base/head mode)'
        required: false
        default: 'main'
      scan_depth:
        description: 'Scan last N commits (0 = full history)'
        required: false
        default: '50'
      fail_on_any:
        description: 'Fail on ANY finding (true) or ONLY verified (false)'
        required: false
        default: 'false'
      extra_args:
        description: 'Additional flags'
        required: false
        default: ''

jobs:
  trufflehog:
    name: TruffleHog (Docker) – scan secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (full history for reliability)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull TruffleHog image
        run: docker pull trufflesecurity/trufflehog:latest

      # Decide the scan range by depth for fast CI.
      - name: Decide scan range (since-commit or full)
        id: range
        shell: bash
        run: |
          set -euo pipefail
          SCAN_DEPTH="${{ inputs.scan_depth || github.event.inputs.scan_depth || 50 }}"

          if [[ "${SCAN_DEPTH}" -eq 0 ]]; then
            # Full history: use the root commit as base
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | head -n1)"
          else
            # Last N commits: use the commit N behind HEAD (or fallback to root)
            if git rev-parse "HEAD~${SCAN_DEPTH}" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "HEAD~${SCAN_DEPTH}")"
            else
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | head -n1)"
            fi
          fi

          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Using base SHA: ${BASE_SHA}"

      - name: Run TruffleHog (Docker)
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          EXTRA_ARGS: ${{ inputs.extra_args || github.event.inputs.extra_args || '' }}
          FAIL_ON_ANY: ${{ inputs.fail_on_any || github.event.inputs.fail_on_any || false }}
        run: |
          set -euo pipefail

          # Select failure policy:
          # - Fail ONLY on verified findings:   --fail --only-verified
          # - Fail on ANY finding (incl. unknown): --fail
          if [[ "${FAIL_ON_ANY}" == "true" ]]; then
            FAIL_FLAGS=(--fail)
          else
            FAIL_FLAGS=(--fail --only-verified)
          fi

          # Split extra args into an array (safe if empty)
          read -r -a EXTRA_ARR <<< "${EXTRA_ARGS}"

          # IMPORTANT:
          # - Use the local repo path FIRST with file:// prefix (required for local scans).
          # - Provide range via flags: --since-commit <BASE_SHA> and optionally --branch HEAD.
          # - The previous attempt failed because positional "BASE HEAD /workdir" is not
          #   supported by the image variant you're using and caused "unexpected HEAD".
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            trufflesecurity/trufflehog:latest \
              git \
              file:///workdir \
              --json \
              "${FAIL_FLAGS[@]}" \
              --since-commit "${BASE_SHA}" \
              --branch HEAD \
              "${EXTRA_ARR[@]:-}" | tee trufflehog_results.json

      - name: Upload results artifact (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog_results.json
          if-no-files-found: warn
