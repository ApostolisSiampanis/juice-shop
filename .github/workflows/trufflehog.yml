name: TruffleHog Secrets Scan

on:

  workflow_call:
    inputs:
      fail_on_any:
        description: 'If true, fail on any finding; otherwise only verified secrets cause failure'
        required: false
        default: false
        type: boolean
      extra_args:
        description: 'Extra flags to pass to trufflehog (optional)'
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      fail_on_any:
        description: 'If true, fail on any finding; otherwise only verified secrets cause failure'
        required: false
        default: 'false'
      extra_args:
        description: 'Extra flags to pass to trufflehog (optional)'
        required: false
        default: ''

jobs:
  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote refs
        run: |
          git fetch --quiet origin "+refs/*:refs/remotes/origin/*"

      - name: Pull TruffleHog image
        run: docker pull trufflesecurity/trufflehog:latest

      - name: Set TruffleHog flags
        id: flags
        shell: bash
        env:
          FAIL_ON_ANY: ${{ inputs.fail_on_any || github.event.inputs.fail_on_any || false }}
        run: |
          set -euo pipefail
          if [[ "${FAIL_ON_ANY}" == "true" ]]; then
            echo "fail_flag=--fail" >> "$GITHUB_OUTPUT"
          else
            echo "fail_flag=" >> "$GITHUB_OUTPUT"
          fi
          # Always include all result types; filtering secrets with
          # --results=verified,unknown or using --only-verified can suppress
          # unverified results and cause legitimate secrets to be missed【104025215300955†L1059-L1063】.
          echo "results_flag=" >> "$GITHUB_OUTPUT"

      - name: TruffleHog – git scan (entire repo)
        shell: bash
        env:
          EXTRA_ARGS: ${{ inputs.extra_args || github.event.inputs.extra_args || '' }}
          FAIL_FLAG: ${{ steps.flags.outputs.fail_flag }}
          RESULTS_FLAG: ${{ steps.flags.outputs.results_flag }}
        run: |
          set -euo pipefail
          read -r -a EXTRA_ARR <<< "${EXTRA_ARGS}"
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            trufflesecurity/trufflehog:latest \
              git \
              file:///workdir \
              --json \
              ${FAIL_FLAG} \
              ${RESULTS_FLAG} \
              --all-branches \
              "${EXTRA_ARR[@]:-}" | tee trufflehog_git.json

      - name: TruffleHog – filesystem scan
        shell: bash
        env:
          EXTRA_ARGS: ${{ inputs.extra_args || github.event.inputs.extra_args || '' }}
          FAIL_FLAG: ${{ steps.flags.outputs.fail_flag }}
          RESULTS_FLAG: ${{ steps.flags.outputs.results_flag }}
        run: |
          set -euo pipefail
          read -r -a EXTRA_ARR <<< "${EXTRA_ARGS}"
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            trufflesecurity/trufflehog:latest \
              filesystem \
              /workdir \
              --json \
              ${FAIL_FLAG} \
              ${RESULTS_FLAG} \
              "${EXTRA_ARR[@]:-}" | tee trufflehog_fs.json

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-results
          path: |
            trufflehog_git.json
            trufflehog_fs.json