name: TruffleHog Secrets Scan

on:
  workflow_call:
    inputs:
      base_branch:
        description: 'Default branch name used as base when computing diff (e.g. main). Only used if you switch to base/head mode.'
        required: false
        default: main
        type: string
      scan_depth:
        description: 'Scan last N commits (0 = full history).'
        required: false
        default: 50
        type: number
      fail_on_any:
        description: 'If true: fail for ANY finding (verified OR unknown). If false: fail ONLY for verified findings.'
        required: false
        default: false
        type: boolean
      extra_args:
        description: 'Additional flags for TruffleHog (e.g. --exclude-paths=.trufflehogignore).'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Default branch (for base/head mode)'
        required: false
        default: 'main'
      scan_depth:
        description: 'Scan last N commits (0 = full history)'
        required: false
        default: '50'
      fail_on_any:
        description: 'Fail on ANY finding (true) or ONLY verified (false)'
        required: false
        default: 'false'
      extra_args:
        description: 'Additional flags'
        required: false
        default: ''

jobs:
  trufflehog:
    name: TruffleHog (Docker) – scan secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (full history for reliability)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull TruffleHog image
        run: docker pull trufflesecurity/trufflehog:latest

      # Compute the BASE SHA from which to scan. We use "last N commits" for fast CI.
      - name: Decide scan range (since-commit or full)
        id: range
        shell: bash
        run: |
          set -euo pipefail
          SCAN_DEPTH="${{ inputs.scan_depth || github.event.inputs.scan_depth || 50 }}"

          if [[ "${SCAN_DEPTH}" -eq 0 ]]; then
            # Full history: root commit
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | head -n1)"
          else
            # Last N commits: pick the commit N steps behind HEAD (or root if not enough commits)
            if git rev-parse "HEAD~${SCAN_DEPTH}" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "HEAD~${SCAN_DEPTH}")"
            else
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | head -n1)"
            fi
          fi

          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "scan_depth=${SCAN_DEPTH}" >> "$GITHUB_OUTPUT"
          echo "Using base SHA: ${BASE_SHA}"

      - name: Run TruffleHog (Docker)
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          EXTRA_ARGS: ${{ inputs.extra_args || github.event.inputs.extra_args || '' }}
          FAIL_ON_ANY: ${{ inputs.fail_on_any || github.event.inputs.fail_on_any || false }}
        run: |
          set -euo pipefail
          # Choose flags based on failure policy:
          # - fail ONLY on verified findings:   --fail --only-verified
          # - fail on ANY finding (incl. unknown): --fail
          if [[ "${FAIL_ON_ANY}" == "true" ]]; then
            FAIL_FLAGS=(--fail)
          else
            FAIL_FLAGS=(--fail --only-verified)
          fi

          # Split EXTRA_ARGS into an array (safe even if empty)
          read -r -a EXTRA_ARR <<< "${EXTRA_ARGS}"

          # Run TruffleHog against local repo history from BASE_SHA..HEAD
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            trufflesecurity/trufflehog:latest \
              git \
              --json \
              "${FAIL_FLAGS[@]}" \
              "${BASE_SHA}" \
              HEAD \
              /workdir \
              "${EXTRA_ARR[@]:-}" | tee trufflehog_results.json

      - name: Upload results artifact (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog_results.json
          if-no-files-found: warn
