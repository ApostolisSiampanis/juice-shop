name: SonarQube Analysis

on:
  workflow_call: {}
  workflow_dispatch:

jobs:
  sonarqube:
    name: Spin up SQ server & scan via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prep runner (jq + kernel params for SonarQube/ES)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # SonarQube (Elasticsearch) requires increased vm.max_map_count
          sudo sysctl -w vm.max_map_count=262144

      - name: Create Docker network
        run: docker network create sonarnet

      - name: Pull images
        run: |
          docker pull sonarqube:lts
          docker pull sonarsource/sonar-scanner-cli:latest

      - name: Start SonarQube server (LTS)
        run: |
          docker run -d --name sonar-server \
            --network sonarnet \
            -p 9000:9000 \
            sonarqube:lts

          echo "Waiting for SonarQube to be UP..."
          # Wait until status returns UP
          timeout=180
          elapsed=0
          until curl -sf http://localhost:9000/api/system/status | grep -q '"UP"'; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "SonarQube did not start within ${timeout}s" >&2
              docker logs sonar-server || true
              exit 1
            fi
            echo "  ...still starting (elapsed ${elapsed}s)"
          done
          echo "SonarQube is UP."

      - name: Bootstrap admin, generate token, and create project
        id: bootstrap
        env:
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # Change the default admin password (if already changed, ignore failure)
          ADMIN_NEW_PWD="admin$(openssl rand -base64 16 | tr -d '=+/[:space:]')"
          curl -sf -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${ADMIN_NEW_PWD}" \
            || true

          # Create a temporary user token as admin
          TOKEN_JSON=$(curl -sf -u "admin:${ADMIN_NEW_PWD}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=gha-${RUN_ID}-${RUN_NUM}")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')

          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token" >&2
            exit 1
          fi

          # Project key dynamically from repo
          PROJECT_KEY="${GITHUB_REPO//\//:}"
          PROJECT_NAME="${GITHUB_REPO#*/}"

          # Create project (idempotent: if already exists, ignore error)
          curl -sf -u "${SONAR_TOKEN}:" -X POST \
            "http://localhost:9000/api/projects/create" \
            -d "project=${PROJECT_KEY}" \
            -d "name=${PROJECT_NAME}" || true

          echo "token=${SONAR_TOKEN}" >> $GITHUB_OUTPUT
          echo "project_key=${PROJECT_KEY}" >> $GITHUB_OUTPUT

      - name: SonarScanner (Docker)
        env:
          SONAR_HOST_URL: http://sonar-server:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          docker run --rm \
            --network sonarnet \
            -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${PROJECT_KEY} -Dsonar.sources=." \
            -e GITHUB_REF 
            -e GITHUB_HEAD_REF 
            -e GITHUB_BASE_REF 
            -e GITHUB_REF_NAME 
            -e GITHUB_ACTIONS=true \
            sonarsource/sonar-scanner-cli:latest

      - name: Wait CE completion & export JSON results
        run: |
          set -euo pipefail

          PROJECT_KEY="${{ steps.bootstrap.outputs.project_key }}"
          SONAR_TOKEN="${{ steps.bootstrap.outputs.token }}"
          echo "::add-mask::${SONAR_TOKEN}"

          SQ_HOST_EXT="http://localhost:9000"
          REPORT_FILE=".scannerwork/report-task.txt"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "Missing ${REPORT_FILE} — cannot track CE task." >&2
            exit 1
          fi

          CE_TASK_ID=$(grep -oP '(?<=ceTaskId=).*' "$REPORT_FILE" || true)
          if [ -z "${CE_TASK_ID:-}" ]; then
            echo "ceTaskId not found in report-task.txt" >&2
            exit 1
          fi

          echo "Waiting for Compute Engine task ${CE_TASK_ID}..."
          while true; do
            STATUS_JSON=$(curl -sf -u "${SONAR_TOKEN}:" "${SQ_HOST_EXT}/api/ce/task?id=${CE_TASK_ID}")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.task.status')
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "CE status: SUCCESS"
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "CE status: ${STATUS}" >&2
              echo "$STATUS_JSON"
              exit 1
            else
              echo "CE status: ${STATUS} ... waiting"
              sleep 3
            fi
          done

          mkdir -p sonar-results

          # Task details
          curl -sf -u "${SONAR_TOKEN}:" \
            "${SQ_HOST_EXT}/api/ce/task?id=${CE_TASK_ID}" \
            > sonar-results/sonar-ce-task.json

          # Quality Gate
          curl -sf -u "${SONAR_TOKEN}:" \
            "${SQ_HOST_EXT}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
            > sonar-results/sonar-quality-gate.json

          # Measures (βασικά KPIs)
          METRICS="bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,security_hotspots,security_rating,reliability_rating,maintainability_rating,sqale_index,ncloc"
          curl -sf -u "${SONAR_TOKEN}:" \
            "${SQ_HOST_EXT}/api/measures/component?component=${PROJECT_KEY}&metricKeys=${METRICS}" \
            > sonar-results/sonar-measures.json

          # All issues (with pagination)
          #   - ps=500 (max) και συγχώνευση όλων των σελίδων σε ένα JSON
          FIRST_PAGE_JSON=$(curl -sf -u "${SONAR_TOKEN}:" \
            "${SQ_HOST_EXT}/api/issues/search?componentKeys=${PROJECT_KEY}&ps=500&p=1")
          echo "$FIRST_PAGE_JSON" > sonar-results/issues-1.json
          TOTAL=$(echo "$FIRST_PAGE_JSON" | jq -r '.paging.total')
          PAGESIZE=$(echo "$FIRST_PAGE_JSON" | jq -r '.paging.pageSize')
          PAGES=$(( (TOTAL + PAGESIZE - 1) / PAGESIZE ))

          if [ "$PAGES" -gt 1 ]; then
            for p in $(seq 2 "$PAGES"); do
              curl -sf -u "${SONAR_TOKEN}:" \
                "${SQ_HOST_EXT}/api/issues/search?componentKeys=${PROJECT_KEY}&ps=500&p=${p}" \
                > "sonar-results/issues-${p}.json"
            done
          fi

          # Combine: issues, components, rules, users
          jq -s '
            {
              paging: (.[0].paging),
              issues:       ( [ .[] | .issues[]? ] ),
              components:   ( [ .[] | .components[]? ] | unique ),
              rules:        ( [ .[] | .rules[]? ] | unique ),
              users:        ( [ .[] | .users[]? ] | unique )
            }
          ' sonar-results/issues-*.json > sonar-results/sonar-issues.json
          rm -f sonar-results/issues-*.json

          # Security Hotspots
          curl -sf -u "${SONAR_TOKEN}:" \
            "${SQ_HOST_EXT}/api/hotspots/search?projectKey=${PROJECT_KEY}&ps=500" \
            > sonar-results/sonar-hotspots.json

          # Component metadata
          curl -sf -u "${SONAR_TOKEN}:" \
            "${SQ_HOST_EXT}/api/components/show?component=${PROJECT_KEY}" \
            > sonar-results/sonar-component.json

          echo "Exported JSON files:"
          ls -1 sonar-results

      - name: Upload SonarQube JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: sonar-results/*.json

      - name: Cleanup
        if: always()
        run: |
          docker logs sonar-server || true
          docker stop sonar-server || true
          docker rm sonar-server || true
          docker network rm sonarnet || true
