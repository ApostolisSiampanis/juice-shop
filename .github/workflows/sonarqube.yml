name: SonarQube Analysis

on:
  workflow_call: {}
  workflow_dispatch:

jobs:
  sonarqube:
    name: Spin up SQ server & scan via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prep runner (jq + kernel params for SonarQube/ES)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # SonarQube (Elasticsearch), change vm.max_map_count
          sudo sysctl -w vm.max_map_count=262144

      - name: Create Docker network
        run: docker network create sonarnet || true

      - name: Pull images
        run: |
          docker pull sonarqube:lts
          docker pull sonarsource/sonar-scanner-cli:latest

      - name: Start SonarQube server (LTS)
        run: |
          docker run -d --name sonar-server \
            --network sonarnet \
            -p 9000:9000 \
            sonarqube:lts

          echo "Waiting for SonarQube to be UP..."
          # Wait until you get status UP
          timeout=180
          elapsed=0
          until curl -sf http://localhost:9000/api/system/status | grep -q '"UP"'; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "SonarQube did not start within ${timeout}s" >&2
              docker logs sonar-server || true
              exit 1
            fi
            echo "  ...still starting (elapsed ${elapsed}s)"
          done
          echo "SonarQube is UP."

      - name: Bootstrap admin, generate token, and create project
        id: bootstrap
        env:
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # Change the default password
          ADMIN_NEW_PWD="admin$(date +%s)"
          curl -sf -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${ADMIN_NEW_PWD}" \
            || true

          # Create an admin token
          TOKEN_JSON=$(curl -sf -u "admin:${ADMIN_NEW_PWD}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=gha-${RUN_ID}-${RUN_NUM}")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')

          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token" >&2
            exit 1
          fi

          # project keys generated from repo
          PROJECT_KEY="${GITHUB_REPO//\//:}"
          PROJECT_NAME="${GITHUB_REPO#*/}"

          # Create project (ignore if exists)
          curl -sf -u "${SONAR_TOKEN}:" -X POST \
            "http://localhost:9000/api/projects/create" \
            -d "project=${PROJECT_KEY}" \
            -d "name=${PROJECT_NAME}" || true

          echo "token=${SONAR_TOKEN}" >> $GITHUB_OUTPUT
          echo "project_key=${PROJECT_KEY}" >> $GITHUB_OUTPUT

      - name: SonarScanner (Docker)
        env:
          SONAR_HOST_URL: http://sonar-server:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          docker run --rm \
            --network sonarnet \
            -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${PROJECT_KEY} -Dsonar.sources=." \
            -e GITHUB_REF -e GITHUB_HEAD_REF -e GITHUB_BASE_REF -e GITHUB_REF_NAME -e GITHUB_ACTIONS=true \
            sonarsource/sonar-scanner-cli:latest

      - name: Wait for CE task & export analysis JSON
        env:
          SONAR_HOST_API: http://localhost:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          set -euo pipefail
          mkdir -p sonar-json

          # Locate and copy report-task.txt
          REPORT_FILE=".scannerwork/report-task.txt"
          if [ ! -f "$REPORT_FILE" ]; then
            REPORT_FILE=$(find . -path "*/.scannerwork/report-task.txt" | head -n1 || true)
          fi
          if [ -z "${REPORT_FILE:-}" ] || [ ! -f "$REPORT_FILE" ]; then
            echo "Cannot find report-task.txt" >&2
            exit 1
          fi
          cp "$REPORT_FILE" sonar-json/report-task.txt

          # Extract CE task id
          CE_TASK_ID=$(awk -F= '/^ceTaskId=/{print $2}' "$REPORT_FILE")
          if [ -z "$CE_TASK_ID" ]; then
            echo "ceTaskId not found in report-task.txt" >&2
            cat "$REPORT_FILE" || true
            exit 1
          fi

          echo "Waiting for CE task $CE_TASK_ID to finish..."
          for i in $(seq 1 60); do
            TASK_JSON=$(curl -sf -u "${SONAR_TOKEN}:" "$SONAR_HOST_API/api/ce/task?id=$CE_TASK_ID")
            echo "$TASK_JSON" > sonar-json/ce-task.json
            STATUS=$(jq -r '.task.status' sonar-json/ce-task.json)
            echo "  status=$STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Compute Engine task finished with $STATUS" >&2
              exit 1
            fi
            sleep 3
          done

          # Paginated export of issues
          PAGE=1
          PAGE_SIZE=500
          while :; do
            RESP="sonar-json/issues_page_${PAGE}.json"
            curl -sf -u "${SONAR_TOKEN}:" \
              "$SONAR_HOST_API/api/issues/search?componentKeys=$PROJECT_KEY&ps=$PAGE_SIZE&p=$PAGE" > "$RESP"
            COUNT=$(jq '.issues | length' "$RESP")
            TOTAL=$(jq -r '.total' "$RESP")
            echo "Fetched page $PAGE (count=$COUNT / total=$TOTAL)"
            if [ $((PAGE * PAGE_SIZE)) -ge "${TOTAL:-0}" ] || [ "${COUNT:-0}" -eq 0 ]; then
              break
            fi
            PAGE=$((PAGE+1))
          done

          # Measures summary
          METRICS="bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,sqale_index,reliability_rating,security_rating,maintainability_rating,ncloc"
          curl -sf -u "${SONAR_TOKEN}:" \
            "$SONAR_HOST_API/api/measures/component?component=$PROJECT_KEY&metricKeys=$METRICS" \
            > sonar-json/measures.json

          # Quality gate status
          curl -sf -u "${SONAR_TOKEN}:" \
            "$SONAR_HOST_API/api/qualitygates/project_status?projectKey=$PROJECT_KEY" \
            > sonar-json/quality_gate.json

          # Branches list
          curl -sf -u "${SONAR_TOKEN}:" \
            "$SONAR_HOST_API/api/project_branches/list?project=$PROJECT_KEY" \
            > sonar-json/branches.json

      - name: Upload Sonar JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonar-json
          path: sonar-json/**
          if-no-files-found: error
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          docker logs sonar-server || true
          docker stop sonar-server || true
          docker rm sonar-server || true
          docker network rm sonarnet || true
