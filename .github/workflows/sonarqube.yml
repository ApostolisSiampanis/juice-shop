name: Static Code Analysis - SonarQube

on:
  workflow_call: {}
  workflow_dispatch:

jobs:
  sonarqube:
    name: Spin up SQ server & scan via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prep runner (jq + kernel params for SonarQube/ES)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # SonarQube (Elasticsearch), change vm.max_map_count
          sudo sysctl -w vm.max_map_count=262144

      - name: Create Docker network
        run: docker network create sonarnet

      - name: Pull images
        run: |
          docker pull sonarqube:lts
          docker pull sonarsource/sonar-scanner-cli:latest

      - name: Start SonarQube server (LTS)
        run: |
          docker run -d --name sonar-server \
            --network sonarnet \
            -p 9000:9000 \
            sonarqube:lts

          echo "Waiting for SonarQube to be UP..."
          # Wait until you get status UP
          timeout=180
          elapsed=0
          until curl -sf http://localhost:9000/api/system/status | grep -q '"UP"'; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "SonarQube did not start within ${timeout}s" >&2
              docker logs sonar-server || true
              exit 1
            fi
            echo "  ...still starting (elapsed ${elapsed}s)"
          done
          echo "SonarQube is UP."

      - name: Bootstrap admin, generate token, and create project
        id: bootstrap
        env:
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # Change the default password
          ADMIN_NEW_PWD="admin$(date +%s)"
          curl -sf -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${ADMIN_NEW_PWD}" \
            || true

          # Create a admin token
          TOKEN_JSON=$(curl -sf -u "admin:${ADMIN_NEW_PWD}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=gha-${RUN_ID}-${RUN_NUM}")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')

          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token" >&2
            exit 1
          fi

          # project keys generated from repo
          PROJECT_KEY="${GITHUB_REPO//\//:}"
          PROJECT_NAME="${GITHUB_REPO#*/}"

          # Create project
          curl -sf -u "${SONAR_TOKEN}:" -X POST \
            "http://localhost:9000/api/projects/create" \
            -d "project=${PROJECT_KEY}" \
            -d "name=${PROJECT_NAME}" || true

          echo "token=${SONAR_TOKEN}" >> $GITHUB_OUTPUT
          echo "project_key=${PROJECT_KEY}" >> $GITHUB_OUTPUT

      - name: SonarScanner (Docker)
        env:
          SONAR_HOST_URL: http://sonar-server:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          docker run --rm \
            --network sonarnet \
            -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${PROJECT_KEY} -Dsonar.sources=." \
            -e GITHUB_REF -e GITHUB_HEAD_REF -e GITHUB_BASE_REF -e GITHUB_REF_NAME -e GITHUB_ACTIONS=true \
            sonarsource/sonar-scanner-cli:latest

      - name: Wait for analysis and export issues
        env:
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          set -e
          # Find the report-task.txt file produced by the scanner.  This file
          # contains the ceTaskId used to monitor background processing.
          REPORT_FILE=$(find . -path "*/.scannerwork/report-task.txt" | head -n 1 || true)
          if [ -z "$REPORT_FILE" ]; then
            echo "report-task.txt not found; unable to monitor analysis." >&2
            exit 1
          fi
          ceTaskId=$(grep -o 'ceTaskId=.*' "$REPORT_FILE" | cut -d '=' -f2)
          if [ -z "$ceTaskId" ]; then
            echo "ceTaskId missing from report-task.txt" >&2
            exit 1
          fi
          echo "Waiting for SonarQube compute engine task $ceTaskId to complete..."
          # Poll the CE task status until it becomes SUCCESS
          for i in $(seq 1 40); do
            status=$(curl -sSf \
              -H "Authorization: Bearer $SONAR_TOKEN" \
              "http://localhost:9000/api/ce/task?id=$ceTaskId" | jq -r '.task.status')
            echo "Current CE task status: $status"
            if [ "$status" = "SUCCESS" ]; then
              break
            fi
            sleep 5
          done
          if [ "$status" != "SUCCESS" ]; then
            echo "Compute engine task did not complete successfully" >&2
            exit 1
          fi
          echo "Fetching issues for project key $PROJECT_KEY..."
          # Retrieve all issues for the analyzed project; the Web API uses bearer
          # authentication and returns JSON data【479886442624313†L68-L82】.
          curl -sSf \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "http://localhost:9000/api/issues/search?componentKeys=$PROJECT_KEY&resolved=false" \
            > sonarqube-results.json
          # Show a summary of issues (count) to aid debugging
          issues_count=$(jq '.issues | length' sonarqube-results.json)
          echo "Exported $issues_count issues to sonarqube-results.json"

      - name: Upload SonarQube results
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: sonarqube-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          docker logs sonar-server || true
          docker stop sonar-server || true
          docker rm sonar-server || true
          docker network rm sonarnet || true