name: Static Code Analysis - SonarQube

on:
  workflow_call: {}
  workflow_dispatch:

jobs:
  sonarqube:
    name: Static Code Analysis - SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prep runner (jq + kernel params for SonarQube/ES)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # SonarQube (Elasticsearch), change vm.max_map_count
          sudo sysctl -w vm.max_map_count=262144

      - name: Create Docker network
        run: docker network create sonarnet

      - name: Pull images
        run: |
          docker pull sonarqube:lts
          docker pull sonarsource/sonar-scanner-cli:latest

      - name: Start SonarQube server (LTS)
        run: |
          # Start SonarQube with JSON log output enabled so that server logs are structured
          docker run -d --name sonar-server \
            --network sonarnet \
            -p 9000:9000 \
            -e SONAR_LOG_JSONOUTPUT=true \
            sonarqube:lts

          echo "Waiting for SonarQube to be UP..."
          # Wait until you get status UP
          timeout=180
          elapsed=0
          until curl -sf http://localhost:9000/api/system/status | grep -q '"UP"'; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "SonarQube did not start within ${timeout}s" >&2
              docker logs sonar-server || true
              exit 1
            fi
            echo "  ...still starting (elapsed ${elapsed}s)"
          done
          echo "SonarQube is UP."

      - name: Bootstrap admin, generate token, and create project
        id: bootstrap
        env:
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # Change the default password
          ADMIN_NEW_PWD="admin$(date +%s)"
          curl -sf -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${ADMIN_NEW_PWD}" \
            || true

          # Create a admin token
          TOKEN_JSON=$(curl -sf -u "admin:${ADMIN_NEW_PWD}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=gha-${RUN_ID}-${RUN_NUM}")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')

          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token" >&2
            exit 1
          fi

          # project keys generated from repo
          PROJECT_KEY="${GITHUB_REPO//\//:}"
          PROJECT_NAME="${GITHUB_REPO#*/}"

          # Create project
          curl -sf -u "${SONAR_TOKEN}:" -X POST \
            "http://localhost:9000/api/projects/create" \
            -d "project=${PROJECT_KEY}" \
            -d "name=${PROJECT_NAME}" || true

          echo "token=${SONAR_TOKEN}" >> $GITHUB_OUTPUT
          echo "project_key=${PROJECT_KEY}" >> $GITHUB_OUTPUT

      - name: SonarScanner (Docker)
        env:
          SONAR_HOST_URL: http://sonar-server:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          docker run --rm \
            --network sonarnet \
            -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${PROJECT_KEY} -Dsonar.sources=." \
            -e GITHUB_REF -e GITHUB_HEAD_REF -e GITHUB_BASE_REF -e GITHUB_REF_NAME -e GITHUB_ACTIONS=true \
            sonarsource/sonar-scanner-cli:latest

      - name: Fetch SonarQube analysis results
        env:
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          set -euo pipefail
          # The scanner writes report-task.txt into the project directory. Read the CE task URL from it.
          # Try to locate the report-task.txt file generated by the scanner. It is
          # typically stored under .scannerwork/. We search to be resilient to
          # directory differences.
          report_file=$(find . -maxdepth 4 -name report-task.txt | head -n1 || true)
          if [ -z "$report_file" ]; then
            echo "report-task.txt not found; cannot fetch results" >&2
          else
            ce_task_url=$(grep 'ceTaskUrl=' "$report_file" | cut -d'=' -f2)
            echo "Waiting for SonarQube compute engine to complete task: $ce_task_url"
            # Poll for completion up to 5 minutes
            for i in {1..60}; do
              status=$(curl -s -u "${SONAR_TOKEN}:" "$ce_task_url" | jq -r '.task.status')
              echo "Status: $status"
              if [ "$status" = "SUCCESS" ]; then
                break
              fi
              sleep 5
            done
            # Fetch all issues for the analyzed project and write to JSON
            curl -s -u "${SONAR_TOKEN}:" "http://localhost:9000/api/issues/search?projects=${PROJECT_KEY}&ps=500" > sonarqube-results.json
          fi

      - name: Upload SonarQube results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: sonarqube-results.json

      - name: Clean up
        if: always()
        run: |
          docker logs sonar-server || true
          docker stop sonar-server || true
          docker rm sonar-server || true
          docker network rm sonarnet || true
          docker image rm sonarsource/sonar-scanner-cli:latest || true