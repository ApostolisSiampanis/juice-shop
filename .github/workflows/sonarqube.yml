name: Static Code Analysis - SonarQube

on:
  workflow_call: {}
  workflow_dispatch:

jobs:
  sonarqube:
    name: Spin up SQ server & scan via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prep runner (jq + kernel params for SonarQube/ES)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # SonarQube (Elasticsearch), change vm.max_map_count
          sudo sysctl -w vm.max_map_count=262144

      - name: Create Docker network
        run: docker network create sonarnet

      - name: Pull images
        run: |
          docker pull sonarqube:lts
          docker pull sonarsource/sonar-scanner-cli:latest

      - name: Start SonarQube server (LTS)
        run: |
          docker run -d --name sonar-server \
            --network sonarnet \
            -p 9000:9000 \
            sonarqube:lts

          echo "Waiting for SonarQube to be UP..."
          # Wait until you get status UP
          timeout=180
          elapsed=0
          until curl -sf http://localhost:9000/api/system/status | grep -q '"UP"'; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "SonarQube did not start within ${timeout}s" >&2
              docker logs sonar-server || true
              exit 1
            fi
            echo "  ...still starting (elapsed ${elapsed}s)"
          done
          echo "SonarQube is UP."

      - name: Bootstrap admin, generate token, and create project
        id: bootstrap
        env:
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          # Change the default password
          ADMIN_NEW_PWD="admin$(date +%s)"
          curl -sf -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${ADMIN_NEW_PWD}" \
            || true

          # Create a admin token
          TOKEN_JSON=$(curl -sf -u "admin:${ADMIN_NEW_PWD}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=gha-${RUN_ID}-${RUN_NUM}")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')

          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token" >&2
            exit 1
          fi

          # project keys generated from repo
          PROJECT_KEY="${GITHUB_REPO//\//:}"
          PROJECT_NAME="${GITHUB_REPO#*/}"

          # Create project
          curl -sf -u "${SONAR_TOKEN}:" -X POST \
            "http://localhost:9000/api/projects/create" \
            -d "project=${PROJECT_KEY}" \
            -d "name=${PROJECT_NAME}" || true

          echo "token=${SONAR_TOKEN}" >> $GITHUB_OUTPUT
          echo "project_key=${PROJECT_KEY}" >> $GITHUB_OUTPUT

      - name: SonarScanner (Docker)
        env:
          SONAR_HOST_URL: http://sonar-server:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          docker run --rm \
            --network sonarnet \
            -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${PROJECT_KEY} -Dsonar.sources=." \
            -e GITHUB_REF -e GITHUB_HEAD_REF -e GITHUB_BASE_REF -e GITHUB_REF_NAME -e GITHUB_ACTIONS=true \
            sonarsource/sonar-scanner-cli:latest

      - name: Wait for analysis and export SonarQube results (JSON)
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.bootstrap.outputs.token }}
          PROJECT_KEY: ${{ steps.bootstrap.outputs.project_key }}
        run: |
          set -euo pipefail

          HOST="${SONAR_HOST_URL}"
          TOKEN="${SONAR_TOKEN}"
          PK="${PROJECT_KEY}"

          echo "Polling SonarQube for completed analysis for project ${PK}..."
          attempts=0
          max_attempts=40
          sleep_seconds=5
          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts+1))
            resp=$(curl -sSf -H "Authorization: Bearer ${TOKEN}" \
              "${HOST}/api/project_analyses/search?project=${PK}")
            anal_count=$(echo "$resp" | jq '.analyses | length' 2>/dev/null || echo 0)
            if [ "${anal_count}" -gt 0 ]; then
              echo "Found ${anal_count} analysis entries."
              break
            fi
            echo "No analyses yet (attempt ${attempts}/${max_attempts}). Sleeping ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

          # ---- Issues (paginated) ----
          echo "Fetching issues (JSON) for ${PK}..."
          echo '[]' > tmp_issues.json
          p=1
          ps=500
          while : ; do
            page=$(curl -sSf -H "Authorization: Bearer ${TOKEN}" \
              "${HOST}/api/issues/search?componentKeys=${PK}&resolved=false&ps=${ps}&p=${p}")
            echo "$page" | jq '.issues' > page_issues.json
            n=$(jq 'length' page_issues.json)
            if [ "$n" -eq 0 ]; then
              break
            fi
            jq -s '.[0] + .[1]' tmp_issues.json page_issues.json > tmp_issues_merged.json
            mv tmp_issues_merged.json tmp_issues.json
            if [ "$n" -lt "$ps" ]; then
              break
            fi
            p=$((p+1))
          done
          jq -n --slurpfile arr tmp_issues.json '{issues:$arr[0]}' > sonar-issues.json

          # ---- Measures ----
          echo "Fetching measures (JSON)..."
          curl -sSf -H "Authorization: Bearer ${TOKEN}" \
            "${HOST}/api/measures/component?component=${PK}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density" \
            > sonar-measures.json || echo '{}' > sonar-measures.json

          # ---- Project info ----
          echo "Fetching project info (JSON)..."
          curl -sSf -H "Authorization: Bearer ${TOKEN}" \
            "${HOST}/api/components/show?component=${PK}" \
            > sonar-project.json || echo '{}' > sonar-project.json

          # ---- Combine into the artifact expected by the workflow ----
          jq -n \
            --slurpfile issues sonar-issues.json \
            --slurpfile measures sonar-measures.json \
            --slurpfile project sonar-project.json \
            '{project: ($project[0].component // {}), measures: ($measures[0].component.measures // []), issues: ($issues[0].issues // [])}' \
            > sonarqube-results.json

          echo "Exported $(jq '.issues | length' sonarqube-results.json) issues to sonarqube-results.json"
          ls -la sonarqube-results.json
      - name: Upload SonarQube results
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: |
            sonarqube-results.json
            sonar-issues.json
            sonar-measures.json
            sonar-project.json
          if-no-files-found: error
          retention-days: 7


      - name: Clean up
        if: always()
        run: |
          docker logs sonar-server || true
          docker stop sonar-server || true
          docker rm sonar-server || true
          docker network rm sonarnet || true