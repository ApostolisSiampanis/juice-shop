name: Dynamic SQL Injection Testing - SQLMap

on:
  # Allow the workflow to be triggered from another workflow or manually
  workflow_call:
  workflow_dispatch:

jobs:
  sqlmap-scan:
    name: Dynamic SQL Injection Testing - SQLMap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install jq in case future parsing of JSON responses is required
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      # Build the Juice Shop image used for SQLMap scanning. A distinct tag is used
      # so it doesn't collide with other workflows.
      - name: Build the Docker Image
        run: docker build . -f Dockerfile -t juice-shop-sqlmap:latest

      # Start the application on a non‑default port to avoid collisions with other jobs
      - name: Start Application (Juice Shop)
        run: docker run -d -p 3001:3000 --name juice-shop-sqlmap juice-shop-sqlmap:latest

      # Wait until the application responds before initiating the scan
      - name: Wait for application to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3001 >/dev/null 2>&1; then
              echo "App is up"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 5
          done

      - name: Run SQLMap scan
        run: |
          mkdir -p sqlmap-reports
          chmod 777 sqlmap-reports
          # Pull the latest SQLMap image
          docker pull sqlmapproject/sqlmap
          # Run sqlmap against a sample parameter; use --batch to avoid prompts
          docker run --rm \
            --network="host" \
            -v "${PWD}/sqlmap-reports:/tmp/output" \
            sqlmapproject/sqlmap \
              -u "http://localhost:3001/?id=1" --batch --level=1 --output-dir=/tmp/output || true

      - name: Upload SQLMap reports
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-results
          path: sqlmap-reports/
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          docker stop juice-shop-sqlmap || true
          docker rm juice-shop-sqlmap || true
          docker image rm juice-shop-sqlmap:latest || true
          docker image rm sqlmapproject/sqlmap || true