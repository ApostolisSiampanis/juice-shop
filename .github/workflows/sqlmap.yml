name: Dynamic Code Analysis - SQLMap

on:
    workflow_call:

permissions:
    contents: read
    security-events: write

jobs:
    sql-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build the Docker Image
              run: docker build . -f Dockerfile -t juice-shop:latest

            - name: Start Application (Juice Shop)
              run: docker run --network host --name juice-shop juice-shop:latest

            - name: Wait for application to be ready
              run: |
                for i in {1..30}; do
                    if curl --silent --fail http://localhost:3000 >/dev/null 2>&1; then
                    echo "App is up"
                    break
                    fi
                    echo "Waiting for app... ($i/30)"
                    sleep 5
                done
            
            - name: Login to Juice Shop to get Bearer Token
              id: login
              run: |
                RESPONSE=$(curl -s -X POST http://localhost:3000/rest/user/login \
                -H "Content-Type: application/json" \
                -d '{"email":"admin@juice-sh.op","password":"admin123"}')
                TOKEN=$(echo "$RESPONSE" | jq -r .authentication.token)
                if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
                    echo "Failed to get auth token"
                    exit 1
                fi
                echo "TOKEN=$TOKEN" >> $GITHUB_ENV

            - name: Run SQLMap scan  
              run: |
                docker run --rm \
                  -v "${{ github.workspace }}/sqlmap-reports:/root/.sqlmap/reports" \
                  parrotsec/sqlmap:latest \
                  -u "http://localhost:3000" \
                  --cookie "token=$TOKEN" \
                  --batch \
                  --crawl 3 \
                  --level 1 \
                  --risk 1 \
                  --threads 10 \
                  --output-dir=/root/.sqlmap/reports

            - name: Upload SQLMap Reports
              uses: actions/upload-artifact@v4
              with:
                name: sqlmap-reports
                path: sqlmap-reports/*