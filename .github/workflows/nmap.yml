name: Network Scan - Nmap

on:
  # Run manually, or reuse via workflow_call if you like
  workflow_call:
    inputs:
      compose_project_name:
        description: 'Compose project name (controls the default network name <project>_default)'
        required: false
        type: string
        default: 'juice'
      compose_file:
        description: 'Path to docker-compose file at repo root'
        required: false
        type: string        
        default: 'docker-compose.yml'
      # Space-separated list of service names to scan (must match services in your compose file)
      service_names:
        description: 'Compose service names to scan (DNS-resolvable on the Compose network)'
        required: false
        type: string        
        default: 'juice-shop'
      # Ports to scan (use 1-65535 for full TCP; you can narrow for speed)
      ports:
        description: 'Ports to scan (e.g., 1-65535 or 80,443,3000)'
        required: false
        type: string        
        default: '1-65535'
      # Extra Nmap flags; -sT works as non-root inside container; --open prints only open ports
      extra_nmap_args:
        description: 'Additional Nmap arguments'
        required: false
        type: string            
        default: '-sT -T4 --open -Pn'

jobs:
  nmap:
    name: Network Scan - Nmap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the custom Nmap image from .github/nmap/Dockerfile
      - name: Build Nmap image
        run: |
          docker build -t local/nmap -f .github/nmap/Dockerfile .

      # Bring up Juice Shop (and anything else in your compose file)
      - name: Start services with docker compose
        env:
          COMPOSE_PROJECT_NAME: ${{ inputs.compose_project_name }}
        run: |
          # -p sets the project name deterministically; the default network will be <project>_default
          docker compose -f "${{ inputs.compose_file }}" -p "${COMPOSE_PROJECT_NAME}" up -d
          
          # Give containers a few seconds to start. Adjust if you need more time for heavy images.
          sleep 10
          
          echo "Compose status:"
          docker compose -p "${COMPOSE_PROJECT_NAME}" ps

      - name: Run Nmap scan (inside Compose default network)
        env:
          COMPOSE_PROJECT_NAME: ${{ inputs.compose_project_name }}
        run: |
          set -euo pipefail
          NETWORK="${COMPOSE_PROJECT_NAME}_default"
          TARGETS_RAW="${{ inputs.service_names }}"
          PORTS="${{ inputs.ports }}"

          mkdir -p scan
          chmod 777 scan

          # Build port args (-p once)
          if [[ "$PORTS" == -p* ]]; then PORT_ARGS="$PORTS"; else PORT_ARGS="-p $PORTS"; fi

          # Split targets: allow comma or space separated
          IFS=', ' read -r -a TARGET_LIST <<< "$TARGETS_RAW"

          RESOLVED_IPS=()
          for s in "${TARGET_LIST[@]}"; do
            [[ -z "$s" ]] && continue

            # Get the container ID for this service
            cid="$(docker compose -p "${COMPOSE_PROJECT_NAME}" ps -q "$s" | head -n1)"
            if [[ -z "$cid" ]]; then
              echo "ERROR: couldn't find a running container for service '$s' in project '${COMPOSE_PROJECT_NAME}'"
              exit 1
            fi

            # Wait up to 60s for the container to have an IP on the network
            ip=""
            for i in {1..60}; do
              ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$cid" || true)"
              [[ -n "$ip" ]] && break
              sleep 1
            done
            if [[ -z "$ip" ]]; then
              echo "ERROR: service '$s' never received an IP on network '$NETWORK'"
              exit 1
            fi

            RESOLVED_IPS+=("$ip")
          done

          echo "Scanning: ${RESOLVED_IPS[*]} on $NETWORK"
          docker run --rm \
            --network "$NETWORK" \
            -v "$PWD/scan:/out" \
            --user "$(id -u):$(id -g)" \
            local/nmap \
              ${{ inputs.extra_nmap_args }} \
              $PORT_ARGS \
              "${RESOLVED_IPS[@]}" \
              -oN /out/nmap_open_ports.txt \
              -oX /out/nmap_open_ports.xml

          echo "Scan files written to ./scan"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: nmap-results
          path: scan/

      - name: Tear down docker compose
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ${{ inputs.compose_project_name }}
        run: |
          docker compose -p "${COMPOSE_PROJECT_NAME}" down -v

      # Remove the locally built Nmap image to clean up disk space
      - name: Clean up image
        if: always()
        run: |
          docker image rm local/nmap || true