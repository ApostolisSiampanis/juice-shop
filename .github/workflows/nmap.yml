name: Network Scan - Nmap

on:
  workflow_call:
    inputs:
      compose_project_name:
        description: 'Compose project name (controls the default network name <project>_default)'
        required: false
        type: string
        default: 'juice'
      compose_file:
        description: 'Path to docker-compose file at repo root'
        required: false
        type: string        
        default: 'docker-compose.yml'
      service_names:
        description: 'Compose service names to scan (DNS-resolvable on the Compose network)'
        required: false
        type: string        
        default: 'juice-shop'
      ports:
        description: 'Ports to scan (e.g., 1-65535 or 80,443,3000)'
        required: false
        type: string        
        default: '1-65535'
      extra_nmap_args:
        description: 'Additional Nmap arguments'
        required: false
        type: string            
        default: '-sT -T4 --open -Pn'
      allowed_ports:
        description: 'Comma-separated allowed open ports (e.g., 80,443,3000)'
        required: false
        type: string
        default: '3000'

jobs:
  nmap:
    name: Network Scan - Nmap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Nmap image
        run: |
          docker build -t local/nmap -f .github/nmap/Dockerfile .

      - name: Start services with docker compose
        env:
          COMPOSE_PROJECT_NAME: ${{ inputs.compose_project_name }}
        run: |
          # -p sets the project name deterministically; the default network will be <project>_default
          docker compose -f "${{ inputs.compose_file }}" -p "${COMPOSE_PROJECT_NAME}" up -d
          
          # Give containers a few seconds to start. Adjust if you need more time for heavy images.
          sleep 10
          
          echo "Compose status:"
          docker compose -p "${COMPOSE_PROJECT_NAME}" ps

      - name: Run Nmap scan (inside Compose default network)
        env:
          COMPOSE_PROJECT_NAME: ${{ inputs.compose_project_name }}
        run: |
          set -euo pipefail
          NETWORK="${COMPOSE_PROJECT_NAME}_default"
          TARGETS_RAW="${{ inputs.service_names }}"
          PORTS="${{ inputs.ports }}"

          mkdir -p scan
          chmod 777 scan

          # Build port args (-p once)
          if [[ "$PORTS" == -p* ]]; then PORT_ARGS="$PORTS"; else PORT_ARGS="-p $PORTS"; fi

          # Split targets: allow comma or space separated
          IFS=', ' read -r -a TARGET_LIST <<< "$TARGETS_RAW"

          RESOLVED_IPS=()
          for s in "${TARGET_LIST[@]}"; do
            [[ -z "$s" ]] && continue

            # Get the container ID for this service
            cid="$(docker compose -p "${COMPOSE_PROJECT_NAME}" ps -q "$s" | head -n1)"
            if [[ -z "$cid" ]]; then
              echo "ERROR: couldn't find a running container for service '$s' in project '${COMPOSE_PROJECT_NAME}'"
              exit 1
            fi

            # Wait up to 60s for the container to have an IP on the network
            ip=""
            for i in {1..60}; do
              ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$cid" || true)"
              [[ -n "$ip" ]] && break
              sleep 1
            done
            if [[ -z "$ip" ]]; then
              echo "ERROR: service '$s' never received an IP on network '$NETWORK'"
              exit 1
            fi

            RESOLVED_IPS+=("$ip")
          done

          echo "Scanning: ${RESOLVED_IPS[*]} on $NETWORK"
          docker run --rm \
            --network "$NETWORK" \
            -v "$PWD/scan:/out" \
            --user "$(id -u):$(id -g)" \
            local/nmap \
              ${{ inputs.extra_nmap_args }} \
              $PORT_ARGS \
              "${RESOLVED_IPS[@]}" \
              -oN /out/nmap_open_ports.txt \
              -oX /out/nmap_open_ports.xml

          echo "Scan files written to ./scan"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: nmap-results
          path: scan/
          retention-days: 7

      - name: Enforce allowed open ports
        run: |
          set -euo pipefail
          ALLOWED_RAW='${{ inputs.allowed_ports }}'
          # Normalize allowed list to array
          IFS=',' read -r -a ALLOWED_ARR <<< "${ALLOWED_RAW}"
          # Build an associative set for quick lookup
          declare -A ALLOWED_SET
          for p in "${ALLOWED_ARR[@]}"; do
            p_trim=$(echo "$p" | xargs)
            [[ -n "$p_trim" ]] && ALLOWED_SET[$p_trim]=1
          done

          # Parse open ports from normal output
          OPEN_PORTS=()
          if [[ -f scan/nmap_open_ports.txt ]]; then
            # Lines like: "PORT   STATE SERVICE" and "3000/tcp open something"
            while read -r line; do
              port=$(echo "$line" | awk -F'/' '/open/ {print $1}')
              [[ -n "$port" ]] && OPEN_PORTS+=("$port")
            done < <(grep -E "open" scan/nmap_open_ports.txt || true)
          fi

          echo "Detected open ports: ${OPEN_PORTS[*]:-none}"

          VIOLATIONS=()
          for op in "${OPEN_PORTS[@]:-}"; do
            [[ -z "$op" ]] && continue
            if [[ -z "${ALLOWED_SET[$op]:-}" ]]; then
              VIOLATIONS+=("$op")
            fi
          done

          if [[ ${#VIOLATIONS[@]} -gt 0 ]]; then
            echo "ERROR: Unexpected open ports: ${VIOLATIONS[*]} (allowed: ${ALLOWED_RAW})" >&2
            exit 1
          fi
          echo "Open ports are within allowed list (${ALLOWED_RAW})."

      - name: Delete Juice Shop Container
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ${{ inputs.compose_project_name }}
        run: |
          docker compose -p "${COMPOSE_PROJECT_NAME}" down -v

      - name: Delete Nmap Container
        if: always()
        run: |
          docker stop local/nmap || true
          docker rm local/nmap || true
          docker image rm local/nmap || true
