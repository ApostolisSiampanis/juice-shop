name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: 
  contents: read
  security-events: write 
  actions: read 
  issues: write 
  pull-requests: write 
  id-token: write

jobs:
  
  trufflehog:
    name: Secrets Scan - TruffleHog (Docker)
    uses: ./.github/workflows/trufflehog.yml

  sonarqube:
    name: Static Code Analysis - SonarQube
    uses: ./.github/workflows/sonarqube.yml

  semgrep:
    name: Static Code Analysis - Semgrep
    uses: ./.github/workflows/semgrep.yml

  snyk:
    name: Static Code Security Analysis - Snyk
    uses: ./.github/workflows/snyk.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  nmap_compose_scan:
    name: Network Scan – Nmap via Docker Compose
    uses: ./.github/workflows/nmap.yml
    with:
      # Path to your compose file at repo root
      compose_file: docker-compose.yml
      # Compose project name (helps isolate the network)
      compose_project_name: juice-shop-ci
      # Service names to scan inside the Compose network (comma-separated)
      service_names: juice-shop
      # What to scan: either specific ports or full range; adjust to taste
      ports: "-p-"
      # Extra nmap flags (examples: SYN scan, faster timing, skip DNS)
      extra_nmap_args: "-sS -T4 -n"