name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: 
  contents: read
  security-events: write 
  actions: read 
  issues: write 
  pull-requests: write 
  id-token: write

jobs:
  
  trufflehog:
    name: Secrets Scan - TruffleHog (Docker)
    uses: ./.github/workflows/trufflehog.yml

  sonarqube:
    name: Static Code Analysis - SonarQube
    uses: ./.github/workflows/sonarqube.yml

  semgrep:
    name: Static Code Analysis - Semgrep
    uses: ./.github/workflows/semgrep.yml

  snyk:
    name: Static Code Security Analysis - Snyk
    uses: ./.github/workflows/snyk.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  nmap_compose_scan:
    uses: ./.github/workflows/nmap.yml
    with:
      compose_file: docker-compose.test.yml
      compose_project_name: juice-shop-ci
      service_names: app
      ports: "-p-"
      extra_nmap_args: >
        -sT -sV --version-all -sC -n -Pn --open --reason -T4
        --script "default,banner,http-title,http-headers,http-methods,http-server-header,http-enum,ssl-enum-ciphers"
