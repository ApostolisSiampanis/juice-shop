name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: 
  contents: read
  security-events: write 
  actions: read 
  issues: write 
  pull-requests: write 
  id-token: write

jobs:
  
  trufflehog:
    name: Secrets Scan - TruffleHog (Docker)
    uses: ./.github/workflows/trufflehog.yml

  sonarqube:
    name: Static Code Analysis - SonarQube
    uses: ./.github/workflows/sonarqube.yml

  semgrep:
    name: Static Code Analysis - Semgrep
    uses: ./.github/workflows/semgrep.yml

  snyk:
    name: Static Code Security Analysis - Snyk
    uses: ./.github/workflows/snyk.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  zap-baseline:
    name: ZAP Baseline Scan
    uses: ./.github/workflows/zaproxy.yml
    
  nmap_compose_scan:
    uses: ./.github/workflows/nmap.yml
    with:
      compose_file: docker-compose.test.yml
      compose_project_name: juice-shop-ci
      service_names: app
      ports: "1-65535"
      extra_nmap_args: "-sT -T4 -n --open -Pn"