name: Dynamic Code Analysis - Zaproxy

on:
    workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
    zap-dast-full-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build the Docker Image
              run: docker build . -f Dockerfile -t juice-shop:latest

            - name: Start Application (Juice Shop)
              run: docker run -d -p 3000:3000 --name juice-shop juice-shop:latest

            - name: Login to Juice Shop to get Bearer Token
              id: login
              run: |
                RESPONSE=$(curl -s -X POST http://localhost:3000/rest/user/login \
                  -H "Content-Type: application/json" \
                  -d '{"email":"admin@juice-sh.op","password":"admin123"}')
                TOKEN=$(echo "$RESPONSE" | jq -r .authentication.token)
                if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
                  echo "Failed to get auth token"
                  exit 1
                fi
                echo "TOKEN=$TOKEN" >> $GITHUB_ENV


            - name: Run ZAP Baseline Scan with Auth Header
              run: |
                mkdir -p zap-reports
                chmod 777 zap-reports
                docker run --rm \
                  -u 1000:1000 \
                  -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
                  --network="host" \
                  -t ghcr.io/zaproxy/zaproxy:stable \
                  zap-baseline.py \
                  -t http://localhost:3000 \
                  -g /zap/wrk/gen.conf \
                  -J /zap/wrk/zap_report.json \
                  -z "replacer.full_list(0).description=AuthHeader" \
                  -z "replacer.full_list(0).matchType=REQUEST_HEADER" \
                  -z "replacer.full_list(0).matchRegex=false" \
                  -z "replacer.full_list(0).replace=\"Authorization: Bearer $TOKEN\"" \
                  -z "replacer.full_list(0).enabled=true" \
                  -I \
                  -T 10 \
                  -d || true

            - name: Upload ZAP reports
              uses: actions/upload-artifact@v4
              with:
                name: zap-scan-reports
                path: |
                  zap_report.json
                  gen.conf