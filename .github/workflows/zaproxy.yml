name: Dynamic Code Analysis - Zaproxy

on:
    workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
    zap-dast-full-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build the Docker Image
              run: docker build . -f Dockerfile -t juice-shop:latest

            - name: Start Application (Juice Shop)
              run: docker run -d -p 3000:3000 --name juice-shop juice-shop:latest

            - name: Run ZAP Baseline Scan
              run: |
                docker run --rm \
                  -u ${{ runner.uid }}:${{ runner.gid }} \
                  -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
                  --network="host" \
                  -t ghcr.io/zaproxy/zaproxy:stable \
                  zap-baseline.py \
                  -t http://localhost:3000 -J \
                  /zap/wrk/zap_report.json || true

            - name: Upload ZAP JSON Report
              uses: actions/upload-artifact@v4
              with:
                name: zap-report-json
                path: zap_report.json