name: Dynamic Code Analysis - Zaproxy

on:
    workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
    zap-dast-full-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            #- name: Set up Docker buildx
            #  uses: docker/setup-buildx-action@v3

            - name: Build the Docker Image
              uses: docker build . -f Dockerfile -t juice/juice-shop:latest

            - name: Start Application (Juice Shop)
              run: docker run -d -p 3000:3000 --name juice-shop juice/juice-shop:latest

            - name: Wait for application to be healthy
              run: |
                for i in {1..30}; do
                  if docker compose exec -T juice-shop curl -s http://localhost:3000/health >/dev/null 2>&1; then
                    echo "Application is up!"
                    break
                  fi
                  echo "Waiting for the app... ($i/30)"
                  sleep 5
                done