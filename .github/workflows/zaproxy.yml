name: Dynamic Code Analysis - Zaproxy

on:
    workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
    zap-dast-full-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Start Application (Juice Shop)
              run: docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 60s        