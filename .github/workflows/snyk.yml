name: Static Code Security Analysis - Snyk

on:
    workflow_call:
        secrets:
            SNYK_TOKEN:
                required: true

permissions:
    contents: read
    security-events: write

jobs:
    snyk-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Install dependencies
              run: |
                sudo apt-get update -y
                sudo apt-get install -y jq
            
            - name: Run Snyk Open Source Scan
              env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              run: |
                echo "Running Snyk scan..."
                docker run --rm \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  -v "${{ github.workspace }}":/project \
                  -w /project \
                  -e SNYK_TOKEN="$SNYK_TOKEN" \
                  snyk/snyk:docker \
                  snyk container test bkimminich/juice-shop:latest \
                  --json-file-output=snyk-results.json \
                  --sarif-file-output=snyk-results.sarif \
                  || true

            - name: Print Snyk results summary
              run: |
                echo "Snyk summary:"
                if [ -f snyk-results.json ]; then
                  jq -r '
                    .vulnerabilities[] |
                    "[\(.severity)] \(.title) in \(.packageName)@\(.version) (\(.from | join(" > ")))"
                  ' snyk-results.json || cat snyk-results.json
                else
                  echo "No snyk-results.json found"
                fi
            
            - name: Upload scan results
              uses: actions/upload-artifact@v4
              with:
                name: snyk-results
                path: |
                  snyk-results.sarif
                  snyk-results.json
                retention-days: 7

            - name: Clean up
              if: always()
              run: |
                docker stop snyk || true
                docker rm snyk || true
                docker image rm snyk/snyk:docker || true